services:
  postgres:
    image: postgres:16-alpine
    container_name: lector-postgres
    environment:
      POSTGRES_USER: lector
      POSTGRES_PASSWORD: lector_secret
      POSTGRES_DB: lector
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lector"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: lector-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lector-backend
    environment:
      DATABASE_URL: postgres://lector:lector_secret@postgres:5432/lector?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_in_production
      PORT: 3000
    volumes:
      - ./library:/app/library
      - ./metadata:/app/metadata
      - ./cache:/app/cache
      - ./logs:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: lector-worker
    environment:
      DATABASE_URL: postgres://lector:lector_secret@postgres:5432/lector?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - ./library:/app/library
      - ./metadata:/app/metadata
      - ./cache:/app/cache
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lector-frontend
    command: npm run dev
    environment:
      API_URL: http://backend:3000
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "8080:3000"
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: lector-nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data: